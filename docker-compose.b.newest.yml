name: "flask_project"

services:
  # Servicio del Backend (Python/Flask API)
  server:
    container_name: flask_backend_api
    build: .
    restart: always
    ports:
      - "8000:8000"
    env_file: ./.env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    networks:
      - app-network
    depends_on:
      - db

  # Servicio de la Base de Datos (PostgreSQL)
  db:
    container_name: flask_postgres_db
    image: postgres:14-alpine
    restart: always
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data: