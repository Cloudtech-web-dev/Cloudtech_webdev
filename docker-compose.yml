name: "ct_web"

services:
  # Servicio del Backend (Python/Flask API)
  server:
    container_name: ct_api
    build: .
    restart: always
    ports:
      - "8001:8000"
    env_file: ./.env
    environment:
      - FLASK_APP=app.py
      - FLASK_ENV=production
    networks:
      - ct-network
    depends_on:
      - db

  # Servicio de la Base de Datos (PostgreSQL)
  db:
    container_name: ct_db
    image: postgres:15-alpine
    restart: always
    env_file: ./.env
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - ct-network

networks:
  ct-network:
    driver: bridge

volumes:
  postgres_data: