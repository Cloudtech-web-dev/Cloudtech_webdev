services:

  # Servicio del Backend (Python/Flask API)
  server:
    build: .
    container_name: cloudtech_server
    restart: always
    volumes:
      - ./src:/app
      - ./migrations:/app/migrations
    env_file: ./.env
    networks:
      - app-network
    depends_on:
      - db

  # Servicio de la Base de Datos (PostgreSQL)
  db:
    image: postgres:15-alpine
    container_name: cloudtech_db
    restart: always
    env_file: ./.env
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
